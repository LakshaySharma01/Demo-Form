<div class="back">
  <div class="container d-flex justify-content-center align-items-center vh-100">
    <div class="card p-4 shadow" style="width: 500px">
      <h3 class="text-center mb-4">Register</h3>
      
      <form [formGroup]="registrationForm">
        <!-- Full Name -->
        <div class="mb-3">
          <label for="fullName" class="form-label">Full Name</label>
          <input
          type="text"
          id="fullName"
          class="form-control"
          placeholder="Enter your full name"
          formControlName="fullName"
          />
        </div>
        
        <!-- Email -->
        <div class="mb-3">
          <label for="email" class="form-label">Email Address</label>
          <input
          type="email"
          id="email"
          class="form-control"
          placeholder="Enter your email"
          formControlName="emailAddress"
          />
        </div>
        
        <!-- Password -->
        <div class="mb-3">
          <label for="password" class="form-label">Password</label>
          <input
          type="password"
          id="password"
          class="form-control"
          placeholder="Enter your password"
          formControlName="pass"
          />
        </div>
        
        <!-- Confirm Password -->
        <div class="mb-3">
          <label for="confirmPassword" class="form-label">Confirm Password</label>
          <input
          type="password"
          id="confirmPassword"
          class="form-control"
          placeholder="Enter your password"
          formControlName="confirmPass"
          />
        </div>
        
        <!-- Address -->
        <div class="mb-3">
          <label class="form-label">Address</label>
          <input type="text" class="form-control mb-2" placeholder="Street" formControlName="Address1"/>
          <input type="text" class="form-control mb-2" placeholder="City" formControlName="Address2"/>
          <input
          type="text"
          class="form-control"
          placeholder="ZIP Code"
          maxlength="6"
          pattern="^\d{6}$"
          title="Please enter exactly 6 digits"
          formControlName="ZipCode"
          />
        </div>
        
        <!-- Terms -->
        <div class="form-check mb-3">
          <input type="checkbox" class="form-check-input" id="terms" required />
          <label class="form-check-label" for="terms">
            I agree to the <a href="#">Terms and Conditions</a>
          </label>
        </div>
        
        <!-- Submit -->
        <button type="submit" class="btn btn-primary w-100" (click)="registrationFormSubmit()">Register</button>
      </form>
    </div>
  </div>
</div>
